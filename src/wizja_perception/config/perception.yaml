# Parameters of the depth-camera perception pipeline.
# NOTE: `camera_names` and `cameras.<name>.topic` are generated by wizja_bringup from
# wizja_bringup/config/cameras.yaml at launch time (one source of truth for the cameras),
# the values below are only used when running the nodes standalone.

cloud_fusion:
  ros__parameters:
    target_frame: base_link
    output_topic: /wizja/fused_points
    camera_names: [front, left, right]
    cameras:
      front: {topic: /camera_front/depth/color/points}
      left:  {topic: /camera_left/depth/color/points}
      right: {topic: /camera_right/depth/color/points}

    range_min: 0.3          # [m] D455 min depth is ~0.4-0.5 m; closer returns are mostly noise
    range_max: 8.0          # [m] D455 depth error grows ~quadratically, >8 m is unreliable for obstacles
    point_stride: 1         # keep every n-th point before voxelization (1 = all; driver decimation already applied)
    voxel_leaf: 0.05        # [m] per-camera voxel downsampling, 0 disables
    publish_rate: 15.0      # [Hz] max fused output rate (only publishes when a camera sent new data)
    stale_timeout: 0.5      # [s] camera without data for this long is excluded from the fusion
    cache_static_tf: true   # camera mounts are rigid: look TF up once and drop the TF listener

    # Points of the rover itself (body, wheels, mast) - axis-aligned box in target_frame.
    # PLACEHOLDER: set to the real rover dimensions (+ a few cm margin).
    self_filter:
      enabled: true
      min: [-0.70, -0.65, -0.20]
      max: [ 0.70,  0.65,  1.20]

obstacle_detector:
  ros__parameters:
    input_topic: /wizja/fused_points
    publish_ground: true    # /wizja/ground_points (debug, costs a little bandwidth)

    ground:
      cell_size: 0.25           # [m] local ground resolution
      range: 10.0               # [m] analysed square is +/- range around base_link
      min_points_per_cell: 3
      percentile: 0.1           # low z quantile of a cell used as its ground height
      expected_ground_z: 0.0    # [m] ground z in base_link when the rover stands level (base_link at wheel contact = 0)
      max_plane_offset: 0.5     # [m] plane fit rejected if this far from expected_ground_z at the rover
      max_tilt_deg: 20.0        # [deg] max rover pitch/roll the plane fit accepts
      ransac_distance: 0.08     # [m]
      ransac_iterations: 200
      min_plane_candidates: 10
      trust_band: 0.12          # [m] cells at most this above the plane are trusted as ground
      max_deviation: 1.0        # [m] local ground kept within plane +/- this
      max_slope_deg: 25.0       # [deg] steeper terrain steps are treated as obstacles

    obstacle:
      min_height: 0.15          # [m] above local ground; lower = more sensitive, more noise
      max_height: 2.0           # [m] above local ground; higher points (overhangs) ignored

    negative:                   # holes / drops (experimental)
      enabled: false
      min_depth: 0.3            # [m] below the ground plane

    grid:                       # /obstacles/grid (nav_msgs/OccupancyGrid in base_link)
      resolution: 0.1
      size: 16.0
      min_obstacle_points: 2

    clusters:                   # /obstacles/clusters + /obstacles/markers
      enabled: true
      tolerance: 0.3            # [m]
      min_size: 10
      max_size: 100000
