# Depth cameras of the rover: WHICH cameras exist and how to read them (serials, driver or
# external, topics, driver settings). Used by the driver launch, the fusion node, the simulator and
# the coverage tool.
#
# WHERE the cameras are mounted is defined in the rover URDF, not here:
#     src/wizja_description/urdf/wizja_rover.urdf.xacro  -> "CAMERA POSITIONS" block
# Every camera below must be placed there under its frame prefix (camera_<name>, or frame_prefix);
# the launch files stop with an error otherwise.
#
# Camera sources:
#   source: driver    (default) this project starts a realsense2_camera node for it and uses its
#                     point cloud /camera_<name>/depth/color/points.
#   source: external  the camera is owned by another process (only one process can open a
#                     RealSense). We only read its depth image (depth_topic + info_topic) and do not
#                     start a driver; in 'cameras_only' mode its frames are not published by us either.
#                     frame_prefix = the frame names that process uses. Not used by default: all three
#                     cameras run on our drivers.
#
# Mounting (rover 3.0), details and reasons in the URDF and README:
#   front: the rover's existing D455 at the front edge of the deck, level (= rover30 camera_joint).
#          Driven by us, so the main rover stack's RealSense launch must not run (see README).
#   left / right: on a ~0.20 m post where the lidar used to be, yaw +/-80 deg, 20 deg down.

target_frame: base_footprint   # frame of the fused cloud and all outputs (ground at z = 0, = Nav2 robot_base_frame)

cameras:
  front:   # "Center" camera, the rover's existing D455
    serial_no: '254122303704'  # still to verify: rs-enumerate-devices -s
  left:
    serial_no: '253822300711'  # quoted string! verify with: rs-enumerate-devices -s
  right:
    serial_no: '253822300777'

# realsense2_camera parameters applied to every camera this project drives (source: driver).
realsense:
  # Depth only. Colour is not needed for obstacle detection and would double the USB load.
  enable_depth: true
  enable_color: false
  enable_infra1: false
  enable_infra2: false
  enable_gyro: false
  enable_accel: false
  # 640x480 @ 15 fps per camera. Both spellings: the key changed between driver versions
  # (4.51: depth_module.profile, >= 4.54: depth_module.depth_profile); the unused one is ignored.
  depth_module.profile: 640x480x15
  depth_module.depth_profile: 640x480x15
  depth_module.emitter_enabled: 1
  depth_module.enable_auto_exposure: true
  # Point cloud computed by the driver (untextured, unordered = NaNs dropped).
  pointcloud.enable: true
  pointcloud.stream_filter: 0
  pointcloud.ordered_pc: false
  # Post-processing on the host: decimation reduces the cloud 4x, spatial+temporal remove
  # speckle noise and flying pixels.
  decimation_filter.enable: true
  decimation_filter.filter_magnitude: 2
  spatial_filter.enable: true
  temporal_filter.enable: true
  hole_filling_filter.enable: false
  # Internal camera frames (camera_<name>_link -> depth optical frame) are published by the driver.
  publish_tf: true
  tf_publish_rate: 0.0
  # Hardware reset on start-up: recovers cameras left in a bad state by a previous crash.
  initial_reset: true
  # Wait between connection retries when a camera is not (yet) present.
  wait_for_device_timeout: -1.0
  reconnect_timeout: 6.0
